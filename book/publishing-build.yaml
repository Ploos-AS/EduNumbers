schema_version: 1
build:
  clean:
    - rm -rf build
  targets:
    publication:
      command: make all
      outputs:
        - build/epub/edunumbers-no.epub
        - build/epub/edunumbers-en.epub
        - build/pdf/edunumbers-no.pdf
        - build/pdf/edunumbers-en.pdf
        - build/print/edunumbers-no-print.pdf
        - build/print/edunumbers-en-print.pdf
        - build/paperback/edunumbers-no-cover.pdf
        - build/paperback/edunumbers-en-cover.pdf
