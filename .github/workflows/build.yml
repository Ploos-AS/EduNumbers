name: Build course

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install publishing toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex calibre poppler-utils epubcheck
      - name: Check sources
        run: make check
      - name: Test interactive tools
        run: |
          node tests/base-converter.test.js
          node tests/bit-visualizer.test.js
          node tests/twos-complement.test.js
          node tests/endian-visualizer.test.js
          node tests/bitmask-playground.test.js
      - name: Build HTML, EPUB, PDF and Kindle
        run: make all
      - name: Upload course artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edunumbers-course
          path: build/
