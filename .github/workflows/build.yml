name: Build course

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install publishing toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex calibre
      - name: Check sources
        run: make check
      - name: Build HTML, EPUB, PDF and Kindle
        run: make all
      - name: Upload course artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edunumbers-course
          path: build/
