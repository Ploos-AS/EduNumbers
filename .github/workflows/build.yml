name: Build course

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install publishing toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-fonts-recommended lmodern poppler-utils epubcheck librsvg2-bin
      - name: Checkout Ploos publishing tools
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/publishing
          path: .ploos-publishing
      - name: Install publishing Python dependencies
        run: python3 -m pip install -r .ploos-publishing/requirements.txt
      - name: Check sources
        run: make check
      - name: Test interactive tools
        run: |
          node tests/base-converter.test.js
          node tests/bit-visualizer.test.js
          node tests/twos-complement.test.js
          node tests/endian-visualizer.test.js
          node tests/bitmask-playground.test.js
          node tests/ieee754-explorer.test.js
          node tests/interactive-i18n.test.js
      - name: Build HTML, EPUB, PDF and Kindle
        run: make all
      - name: Build paperback covers from actual page counts
        run: make paperback
      - name: Re-run POD QA with covers
        run: make pod-qa
      - name: Upload course artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edunumbers-course
          path: build/
