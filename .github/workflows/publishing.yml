name: Publishing M3 pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - publication.yaml
      - book/**
      - course/**
      - Makefile
      - .github/workflows/publishing.yml

permissions:
  contents: read

jobs:
  qualify-no:
    uses: Ploos-AS/publishing/.github/workflows/reusable-book-release.yml@f2f6489459a7b7029a02307075b030c59e351592
    with:
      publishing_ref: f2f6489459a7b7029a02307075b030c59e351592
      metadata: publication.yaml
      isbn_registry: .ploos-publishing/isbn/registry.yaml
      build_config: book/publishing-build.yaml
      epub: build/epub/edunumbers-no.epub
      pdf: build/pdf/edunumbers-no.pdf
      artifact_name: edunumbers-no-qualified

  qualify-en:
    uses: Ploos-AS/publishing/.github/workflows/reusable-book-release.yml@f2f6489459a7b7029a02307075b030c59e351592
    with:
      publishing_ref: f2f6489459a7b7029a02307075b030c59e351592
      metadata: publication.yaml
      isbn_registry: .ploos-publishing/isbn/registry.yaml
      build_config: book/publishing-build.yaml
      epub: build/epub/edunumbers-en.epub
      pdf: build/pdf/edunumbers-en.pdf
      artifact_name: edunumbers-en-qualified
