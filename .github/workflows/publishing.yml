name: Publishing M3 pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - publication.yaml
      - book/**
      - course/**
      - Makefile
      - .github/workflows/publishing.yml

permissions:
  contents: read

jobs:
  qualify-no:
    uses: Ploos-AS/publishing/.github/workflows/reusable-book-release.yml@a8b639da5e4a385b3c05e3f16472f08ac9993e20
    with:
      publishing_ref: a8b639da5e4a385b3c05e3f16472f08ac9993e20
      metadata: publication.yaml
      isbn_registry: .ploos-publishing/isbn/registry.yaml
      build_config: book/publishing-build.yaml
      epub: build/epub/edunumbers-no.epub
      pdf: build/pdf/edunumbers-no.pdf
      print_pdf: build/print/edunumbers-no-print.pdf
      cover_pdf: build/paperback/edunumbers-no-cover.pdf
      artifact_name: edunumbers-no-qualified

  qualify-en:
    uses: Ploos-AS/publishing/.github/workflows/reusable-book-release.yml@a8b639da5e4a385b3c05e3f16472f08ac9993e20
    with:
      publishing_ref: a8b639da5e4a385b3c05e3f16472f08ac9993e20
      metadata: publication.yaml
      isbn_registry: .ploos-publishing/isbn/registry.yaml
      build_config: book/publishing-build.yaml
      epub: build/epub/edunumbers-en.epub
      pdf: build/pdf/edunumbers-en.pdf
      print_pdf: build/print/edunumbers-en-print.pdf
      cover_pdf: build/paperback/edunumbers-en-cover.pdf
      artifact_name: edunumbers-en-qualified
