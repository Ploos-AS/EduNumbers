<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduNumbers – Endian-visualisering</title><link rel="stylesheet" href="style.css"></head><body><main>
<p><a href="../../no/">← EduNumbers</a></p><h1>Endian-visualisering</h1>
<p>Se hvordan samme heltall lagres byte for byte i minnet med big-endian og little-endian.</p>
<section class="controls"><label>Hex-verdi <input id="value" value="12345678" spellcheck="false"></label>
<label>Bredde <select id="width"><option>16</option><option selected>32</option><option>64</option></select> bit</label>
<label>Startadresse <input id="address" value="1000" spellcheck="false"></label><p id="error" role="alert"></p></section>
<p><strong>Normalisert verdi:</strong> <code id="normalized"></code></p>
<section class="orders"><div><h2>Big-endian</h2><p>Most significant byte først.</p><div id="big" class="memory"></div></div>
<div><h2>Little-endian</h2><p>Least significant byte først.</p><div id="little" class="memory"></div></div></section>
</main><script src="endian.js"></script></body></html>
