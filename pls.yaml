resource:
  title: "EduNumbers / Tallsystemer / Number Systems"
  type: course
  language:
    - no
    - en
  scope: "Number systems and numeric representations used in computing, from positional notation and base conversion through integer, fixed-point, floating-point, bit-level, memory, hardware, networking, file-format, debugging, and reverse-engineering applications."
  prerequisites:
    - "Basic integer arithmetic: addition, subtraction, multiplication, and division."
  learning_outcomes:
    - "Explain positional number systems and distinguish a number from its representation."
    - "Convert values correctly between decimal, binary, hexadecimal, and octal representations."
    - "Explain and use unsigned integers, signed integers, two's complement, fixed-point, and floating-point representations."
    - "Apply binary arithmetic, bitwise operations, masks, fields, endianness, and encoded values to practical computing problems."
    - "Interpret numeric representations in assembly language, C, Python, memory dumps, hardware registers, networks, and file formats."
    - "Use correct terminology and justify representation choices and debugging conclusions rather than only reproduce procedures."
